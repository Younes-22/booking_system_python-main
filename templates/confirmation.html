<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Booking Confirmation</h1>
        <div class="confirmation">
            <p>{{ success_message }}</p>
            <div class="booking-details">
                <p><strong>Email:</strong> {{ booking_details.email }}</p>
                <p><strong>Full Name:</strong> {{ booking_details.full_name }}</p>
                <p><strong>Room:</strong> {{ booking_details.room }}</p>
                <p><strong>Date:</strong> {{ booking_details.date }}</p>
                <p><strong>Time Slot:</strong> {{ booking_details.time_slot }}</p>
            </div>
        </div>
        <a href="{{ url_for('index') }}" class="back-link">Back to Booking Form</a>
    </div>
</body>
</html>
