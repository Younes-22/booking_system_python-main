<!-- cancel.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h1>Cancel Booking</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('cancel_booking') }}" method="POST">
            <div class="form-group">
                <label for="unique_code">Enter your unique cancellation code:</label>
                <input type="text" id="unique_code" name="unique_code" required>
            </div>

            <div class="form-group">
                <button type="submit">Cancel Booking</button>
            </div>
             <!-- Back to Booking Form link -->
        <a href="{{ url_for('index') }}" class="back-link">Back to Booking Form</a>
    </div>
        </form>
    </div>
</body>

</html>
